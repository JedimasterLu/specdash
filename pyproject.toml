[project]
name = "spectra"
version = "0.1.0"
description = "Interactive processing and visualization of Andor Solis .asc spectra."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dash>=4.0",
    "numpy>=2.0",
    "plotly>=5.22",
    "scipy>=1.13",
]

[project.scripts]
spectra = "spectra.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spectra"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.9",
]
