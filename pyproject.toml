[project]
name = "specdash"
version = "0.3.0"
description = "Desktop app for interactive processing and visualization of Andor Solis .asc spectra."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dash>=4.0",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "plotly>=5.22",
    "pywebview>=5.3",
]

[project.scripts]
specdash = "specdash.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specdash"]

[dependency-groups]
build = [
    "pyinstaller>=6.10; sys_platform == 'win32'",
    "py2app>=0.28; sys_platform == 'darwin'",
]
dev = [
    "ipykernel>=7.2.0",
]
